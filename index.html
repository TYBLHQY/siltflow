<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:* siltflow: wss://speech.platform.bing.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://api.openai.com https://api.deepseek.com https://api.groq.com https://openrouter.ai https://generativelanguage.googleapis.com https://api.x.ai https://api.mistral.ai https://api.together.xyz https://api.fireworks.ai https://api.cerebras.ai https://api.perplexity.ai https://dashscope.aliyuncs.com https://api.deepinfra.com https://api.sambanova.ai http://localhost:11434 http://localhost:1234 https://api.xiaomimimo.com https://api.github.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; frame-src 'self'"
    />
    <title>Siltflow</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- PDF 夜间主题模式用：按亮度把 PDF 内容映射到当前主题文字色
         （黑→主题文字色，白→黑，配合 screen 混合透出主题底色）。
         matrix 值由 App.tsx applyTheme 依 --catppuccin-color-text 动态更新。 -->
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <filter id="pdf-theme-invert" color-interpolation-filters="sRGB">
        <feColorMatrix
          id="pdf-theme-invert-matrix"
          type="matrix"
          values="
            -0.2126 -0.7152 -0.0722 0 0.804
            -0.2126 -0.7152 -0.0722 0 0.839
            -0.2126 -0.7152 -0.0722 0 0.957
            0 0 0 1 0
          "
        />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
