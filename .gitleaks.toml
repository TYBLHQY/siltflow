# Gitleaks configuration for Siltflow
# Paths matching these patterns are excluded from scanning

[allowlist]
  description = "Build artifacts and generated files"

  paths = [
    # Build outputs
    "release/",
    "dist/",
    "dist-electron/",
    "build/",
    # Dependencies
    "node_modules/",
    # Claude Code
    ".claude/",
    # Audit reports
    "reports/",
    # asar archives
    "\\.asar$",
    # Package lock - regenerated
    "pnpm-lock\\.yaml$",
  ]
