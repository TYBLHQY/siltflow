services:
  sync-server:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    container_name: siltflow-server
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      # SQLite database + uploaded PDFs are stored here inside the container.
      # Mount a named volume so data survives image rebuilds.
      - siltflow-data:/data
    environment:
      - PORT=${PORT:-3001}
      - DATA_DIR=/data
      # SERVER_TOKEN: the secret clients need to register a device.
      # Generate one with: openssl rand -hex 32
      # If left empty, the server auto-generates and persists it on first start.
      - SERVER_TOKEN=${SERVER_TOKEN:-}
      - TOMBSTONE_RETENTION_DAYS=${TOMBSTONE_RETENTION_DAYS:-30}
    restart: unless-stopped

volumes:
  siltflow-data:
