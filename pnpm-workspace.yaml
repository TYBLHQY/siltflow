allowBuilds:
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
# Pin dev/build-chain transitive deps to patched versions (CVE fixes).
# pnpm v11 reads settings from this file, not the "pnpm" field in package.json.
overrides:
  nanoid@3: 3.3.17
  fast-uri@3: 3.1.5
  js-yaml@4: 4.3.1
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  undici@6: 6.28.0
  tar@7: 7.5.22
