name: "Install dependencies"
description: "pnpm setup (cached) + install with frozen lockfile. Shared by all CI jobs so dependency resolution/Electron download happens once and is cached. NOTE: the caller job must run actions/checkout BEFORE using this action (local composite actions are resolved from the working tree)."
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Electron ≥43 removed its postinstall script — the binary is downloaded
    # lazily on first `electron .` run, or explicitly via the `install-electron`
    # bin. Playwright E2E spawns the binary directly, so ensure it's present.
    # Idempotent: install.js exits early when dist/version matches.
    - name: Download Electron binary
      shell: bash
      run: pnpm exec install-electron
