name: CI – Desktop

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Release ────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: mac
          - os: windows-2022
            target: win

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install system deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-dev libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ matrix.target }}-

      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: apps/desktop/node_modules/.cache
          key: tsc-cache-${{ matrix.target }}-${{ hashFiles('apps/desktop/tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            tsc-cache-${{ matrix.target }}-

      - name: Build (lint + type-check + test + vite in parallel)
        shell: bash
        working-directory: apps/desktop
        run: |
          set -e
          pnpm run lint &
          LINT_PID=$!
          pnpm exec tsc &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          pnpm exec vite build &
          VITE_PID=$!
          FAIL=0
          wait $LINT_PID || FAIL=1
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          wait $VITE_PID || FAIL=1
          exit $FAIL

      - name: Package with electron-builder
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish=never

      - name: Upload artifacts to unified release
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"

          if [ "${{ matrix.target }}" = "linux" ]; then
            # Create or update the unified release (Linux runner owns this)
            if gh release view release --json tagName &>/dev/null; then
              echo "Updating existing unified release…"
            else
              echo "Creating unified release…"
              PREV_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
              if [ -n "$PREV_TAG" ]; then
                CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null || echo "* (recent changes)")
              else
                CHANGELOG=$(git log --oneline --no-merges -20)
              fi
              {
                echo "## Desktop $VERSION"
                echo ""
                echo "$CHANGELOG"
              } > /tmp/release-notes.md
              gh release create release \
                --title "Siltflow" \
                --target "${{ github.sha }}" \
                --latest \
                --notes-file /tmp/release-notes.md
            fi
          else
            # mac/win: wait for the unified release to exist
            echo "Waiting for unified release to be ready…"
            for i in $(seq 1 30); do
              if gh release view release --json tagName &>/dev/null; then
                echo "Unified release found."
                break
              fi
              echo "  attempt $i/30 — not ready yet, sleeping 10s…"
              sleep 10
            done
            if ! gh release view release --json tagName &>/dev/null; then
              echo "ERROR: Unified release was not found after 5 minutes."
              exit 1
            fi
          fi

          for f in release/*/*; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload release "$f" --clobber
            fi
          done
