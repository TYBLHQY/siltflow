name: CI

on:
  push:
    tags: ['desktop-v*', 'mobile-v*', 'server-v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Check ──────────────────────────────────────────────────────────────
  # Runs on every push / PR / tag. Block release until this passes.
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: apps/desktop/node_modules/.cache
          key: tsc-cache-${{ runner.os }}-${{ hashFiles('apps/desktop/tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            tsc-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + TypeCheck + Test (desktop)
        working-directory: apps/desktop
        run: |
          set -e
          pnpm run lint &
          LINT_PID=$!
          pnpm exec tsc &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $LINT_PID || FAIL=1
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: TypeCheck + Test (sync-server)
        working-directory: apps/sync-server
        run: |
          set -e
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: TypeCheck + Test (mobile)
        working-directory: apps/mobile
        run: |
          set -e
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

  # ── Release ────────────────────────────────────────────────────────────
  # Only on desktop version tags, and only after check passes.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: mac
          - os: windows-2022
            target: win

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for git log between tags in release notes

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install system deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-dev libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ matrix.target }}-

      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: apps/desktop/node_modules/.cache
          key: tsc-cache-${{ matrix.target }}-${{ hashFiles('apps/desktop/tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            tsc-cache-${{ matrix.target }}-

      - name: Build (type-check + vite in parallel)
        shell: bash
        working-directory: apps/desktop
        run: |
          set -e
          pnpm exec tsc &
          TSC_PID=$!
          pnpm exec vite build &
          VITE_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $VITE_PID || FAIL=1
          exit $FAIL

      - name: Package with electron-builder
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish=never

      - name: Upload artifacts to release
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#desktop-v}"

          # ── Create the release (once, from the linux runner) ────────────
          if [ "${{ matrix.target }}" = "linux" ]; then
            PREV_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null || echo "* (recent changes)")
            else
              CHANGELOG=$(git log --oneline --no-merges -20)
            fi
            {
              echo "## What's Changed"
              echo ""
              echo "$CHANGELOG"
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG:-$(git tag --sort=-creatordate | head -1)}...${TAG}"
            } > /tmp/release-notes.md
            gh release create "$TAG" --title "Desktop $TITLE" --target "${{ github.sha }}" --notes-file /tmp/release-notes.md
          else
            # ── Wait for linux to create the release ───────────────────
            echo "Waiting for release $TAG to be created…"
            for i in $(seq 1 30); do
              if gh release view "$TAG" --json tagName &>/dev/null; then
                echo "Release $TAG found."
                break
              fi
              echo "  attempt $i/30 — not ready yet, sleeping 10s…"
              sleep 10
            done
            if ! gh release view "$TAG" --json tagName &>/dev/null; then
              echo "ERROR: Release $TAG was not created after 5 minutes."
              exit 1
            fi
          fi

          # ── Upload artifacts ────────────────────────────────────────────
          for f in release/*/*; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done

  # ── Android ──────────────────────────────────────────────────────────────
  # Builds the mobile APK on mobile version tags and uploads it along with
  # latest.json so the app can check for updates via GitHub Releases.
  android:
    needs: check
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle needs ANDROID_HOME / ANDROID_SDK_ROOT. The ubuntu-24.04
      # runner ships cmdline-tools; we accept whatever license so the
      # build doesn't hang.
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Bump version to match tag
        shell: bash
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          node -e "
            const p = require('./package.json');
            const a = require('./app.json');
            p.version = '$VERSION';
            a.expo.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            require('fs').writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
          "
          sed -i "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$VERSION\"/" \
            src/services/update.service.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck + Test (mobile)
        working-directory: apps/mobile
        run: |
          set -e
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Generate latest.json
        shell: bash
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          APK_DIR="android/app/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -name "Siltflow-v${VERSION}-*.apk" | head -1)

          if [ ! -f "$APK" ]; then
            echo "APK not found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          APK_NAME=$(basename "$APK")

          # Read versionCode from the build output (we compute it in build.gradle)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          cat > latest.json << EOF
          {
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}",
            "size": ${SIZE},
            "sha256": "${SHA256}",
            "abi": "arm64-v8a",
            "minSdkVersion": 24
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Create release + upload APK and latest.json
        shell: bash
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#mobile-v}"
          APK_DIR="android/app/build/outputs/apk/release"

          # Create the release directly (this job owns it)
          gh release create "$TAG" \
            --title "Mobile $TITLE" \
            --target "${{ github.sha }}" \
            --notes "Mobile Android release $TITLE"

          gh release upload "$TAG" "$APK_DIR"/*.apk --clobber
          gh release upload "$TAG" latest.json --clobber

  # ── Server ───────────────────────────────────────────────────────────────
  # Builds the sync-server Docker image on server version tags, pushes to GHCR,
  # and uploads latest-server.json to the release.
  server:
    needs: check
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bump version to match tag
        shell: bash
        working-directory: apps/sync-server
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          node -e "
            const p = require('./package.json');
            p.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          # Also bump the dashboard package.json (same version, same release)
          node -e "
            const p = require('./dashboard/package.json');
            p.version = '$VERSION';
            require('fs').writeFileSync('./dashboard/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck + Test (sync-server)
        working-directory: apps/sync-server
        run: |
          set -e
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: Build server + dashboard
        working-directory: apps/sync-server
        run: |
          pnpm run build:server
          pnpm run build:dashboard

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/siltflow-server
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate latest-server.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          IMAGE="ghcr.io/${OWNER}/siltflow-server:${VERSION}"

          cat > latest-server.json << EOF
          {
            "version": "${VERSION}",
            "dockerImage": "${IMAGE}",
            "bundleUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/server.cjs",
            "healthEndpoint": "/health"
          }
          EOF

          echo "Generated latest-server.json:"
          cat latest-server.json

      - name: Create release + upload artifacts
        shell: bash
        working-directory: apps/sync-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#server-v}"

          gh release create "$TAG" \
            --title "Server $TITLE" \
            --target "${{ github.sha }}" \
            --notes "Sync server release $TITLE"

          gh release upload "$TAG" dist/server.cjs --clobber
          gh release upload "$TAG" ../../latest-server.json --clobber
