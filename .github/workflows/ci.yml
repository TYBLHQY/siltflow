name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  # ESLint with strict warnings. Runs in parallel with `check`.
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-deps

      - name: ESLint
        run: pnpm lint

  # ── Check ────────────────────────────────────────────────────────────
  # Fast deterministic gates (oxlint, knip, depcruiser, format, CVE, secrets).
  # Runs in parallel with `lint`.
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks PR scan needs full history

      - uses: ./.github/actions/install-deps

      - name: Lint (oxlint, type-aware)
        run: pnpm check:oxlint

      - name: Dead code (knip)
        run: pnpm check:knip

      - name: Architecture (dependency-cruiser)
        run: pnpm check:deps

      - name: Formatting (Prettier)
        run: pnpm format:check

      - name: Dependency audit (CVE scan)
        run: pnpm audit:deps

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── TypeCheck + Unit tests ────────────────────────────────────────────
  # Fast deterministic gates. Runs in parallel with `lint` and `check`.
  unit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-deps

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

  # ── E2E ──────────────────────────────────────────────────────────────
  # Real Electron under xvfb against the built app. Blocking gate before
  # any release; also runs on PRs to catch regressions early.
  e2e:
    needs: [check, lint, unit]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-deps

      - name: Install Linux runtime deps for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-dev libfuse2

      - name: Build (type-check + vite in parallel)
        shell: bash
        run: |
          set -e
          pnpm exec tsc &
          TSC_PID=$!
          pnpm exec vite build &
          VITE_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $VITE_PID || FAIL=1
          exit $FAIL

      - name: Run Electron E2E under xvfb
        run: xvfb-run -a pnpm test:e2e

  # ── Release ────────────────────────────────────────────────────────────
  # Only on version tags, and only after all gates pass.
  release:
    needs: [check, lint, unit, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: mac
          - os: windows-2022
            target: win

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for git log between tags in release notes

      - uses: ./.github/actions/install-deps

      - name: Bump package.json version to match tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Install system deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-dev libfuse2

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ matrix.target }}-

      - name: Build (type-check + vite in parallel)
        shell: bash
        run: |
          set -e
          pnpm exec tsc &
          TSC_PID=$!
          pnpm exec vite build &
          VITE_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $VITE_PID || FAIL=1
          exit $FAIL

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish=never

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # ── Create the release (linux only) ──────────────────────────
          if [ "${{ matrix.target }}" = "linux" ]; then
            PREV_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null || echo "* (recent changes)")
            else
              CHANGELOG=$(git log --oneline --no-merges -20)
            fi
            {
              echo "## What's Changed"
              echo ""
              echo "$CHANGELOG"
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG:-$(git tag --sort=-creatordate | head -1)}...${TAG}"
            } > /tmp/release-notes.md
            gh release create "$TAG" --title "${TAG#v}" --target "${{ github.sha }}" --notes-file /tmp/release-notes.md
          else
            # ── Wait for linux job to create the release ──────────────
            echo "Waiting for release $TAG to be created by the linux job…"
            for i in $(seq 1 30); do
              if gh release view "$TAG" --json tagName &>/dev/null; then
                echo "Release $TAG found."
                break
              fi
              echo "  attempt $i/30 — not ready yet, sleeping 10s…"
              sleep 10
            done
            if ! gh release view "$TAG" --json tagName &>/dev/null; then
              echo "ERROR: Release $TAG was not created after 5 minutes."
              exit 1
            fi
          fi

          # ── Upload artifacts ────────────────────────────────────────
          for f in release/*/*; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done

      - name: Mark release as published (Linux only)
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false
