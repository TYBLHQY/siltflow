name: CI – Server

on:
  push:
    tags: ['server-v*']

permissions:
  contents: read

jobs:
  server:
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: apps/sync-server/node_modules/.cache
          key: tsc-cache-server-${{ runner.os }}-${{ hashFiles('apps/sync-server/tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            tsc-cache-server-${{ runner.os }}-

      - name: Bump version to match tag
        shell: bash
        working-directory: apps/sync-server
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          node -e "
            const p = require('./package.json');
            p.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          node -e "
            const p = require('./dashboard/package.json');
            p.version = '$VERSION';
            require('fs').writeFileSync('./dashboard/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck + Test
        working-directory: apps/sync-server
        run: |
          set -e
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: Build server + dashboard
        working-directory: apps/sync-server
        run: |
          pnpm run build:server
          pnpm run build:dashboard

      - name: Package dashboard
        working-directory: apps/sync-server
        run: tar -czf dist/dashboard.tar.gz dist-dashboard

      - name: Generate latest-server.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          cat > latest-server.json << EOF
          {
            "version": "${VERSION}",
            "bundleUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/server.cjs",
            "healthEndpoint": "/health"
          }
          EOF

          echo "Generated latest-server.json:"
          cat latest-server.json

      - name: Create release + upload artifacts
        shell: bash
        working-directory: apps/sync-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#server-v}"

          # Delete existing release (idempotent re-run)
          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" \
            --title "Server $TITLE" \
            --target "${{ github.sha }}" \
            --latest=false \
            --generate-notes

          gh release upload "$TAG" dist/server.cjs --clobber
          gh release upload "$TAG" install.sh --clobber
          gh release upload "$TAG" dist/dashboard.tar.gz --clobber
          gh release upload "$TAG" ../../latest-server.json --clobber
