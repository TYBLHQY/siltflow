name: CI – Mobile

on:
  push:
    tags: ['mobile-v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Android ────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: apps/mobile/node_modules/.cache
          key: tsc-cache-mobile-${{ runner.os }}-${{ hashFiles('apps/mobile/tsconfig.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            tsc-cache-mobile-${{ runner.os }}-

      - uses: actions/setup-java@v4
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Bump version to match tag
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        shell: bash
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          node -e "
            const p = require('./package.json');
            const a = require('./app.json');
            p.version = '$VERSION';
            a.expo.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            require('fs').writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
          "
          sed -i "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$VERSION\"/" \
            src/services/update.service.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + TypeCheck + Test
        shell: bash
        working-directory: apps/mobile
        run: |
          set -e
          pnpm run lint &
          LINT_PID=$!
          pnpm run typecheck &
          TSC_PID=$!
          pnpm exec vitest run &
          TEST_PID=$!
          FAIL=0
          wait $LINT_PID || FAIL=1
          wait $TSC_PID || FAIL=1
          wait $TEST_PID || FAIL=1
          exit $FAIL

      - name: Cache Gradle
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: |
            gradle-mobile-${{ runner.os }}-

      - name: Prebuild Android project
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Generate latest.json
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        shell: bash
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          APK_DIR="android/app/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -name "Siltflow-v${VERSION}-*.apk" | head -1)

          if [ ! -f "$APK" ]; then
            echo "APK not found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          APK_NAME=$(basename "$APK")

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          cat > latest.json << EOF
          {
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}",
            "size": ${SIZE},
            "sha256": "${SHA256}",
            "abi": "arm64-v8a",
            "minSdkVersion": 24
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Create release + upload APK and latest.json
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        shell: bash
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#mobile-v}"
          APK_DIR="android/app/build/outputs/apk/release"

          gh release create "$TAG" \
            --title "Mobile $TITLE" \
            --target "${{ github.sha }}" \
            --notes "Mobile Android release $TITLE"

          gh release upload "$TAG" "$APK_DIR"/*.apk --clobber
          gh release upload "$TAG" latest.json --clobber
